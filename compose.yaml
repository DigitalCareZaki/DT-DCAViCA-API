name: avica

services:
  db:
    image: postgres
    restart: always
    container_name: avica-db
    environment:
      POSTGRES_DB: avica-db
      POSTGRES_USER: avica
      POSTGRES_PASSWORD: mysecretpassword
    ports:
      - 5432:5432
    networks:
      network:
        ipv4_address: '172.20.1.2'

  pgadmin4:
    image: dpage/pgadmin4
    restart: always
    container_name: avica-pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: user@email.com
      PGADMIN_DEFAULT_PASSWORD: mysecretpassword
      PGADMIN_LISTEN_PORT: 80
    ports:
      - 80:80
    networks:
      network:
        ipv4_address: '172.20.1.3'

networks:
  network:
    ipam:
      driver: default
      config:
        - subnet: '172.20.1.0/24'
          gateway: '172.20.1.1'
